/* ---------- Синхронизация через закрытый репозиторий GitHub ----------
   Каждое изменение помечается временем по ключу (день участника, цветок, цель…).
   При синхронизации по каждому ключу побеждает более свежая версия, поэтому
   отметки мужа и жены, сделанные на разных телефонах, не затирают друг друга. */
const ARR={member:'members',rel:'relatives',habit:'habits',plant:'plants',goal:'goals',book:'books',arc:'arch'};
const touch=k=>{S.ts[k]=Date.now()};
function allKeys(st){const k=['ch'];for(const m in st.log||{})for(const d in st.log[m])k.push(`log|${m}|${d}`);for(const m in st.notes||{})for(const d in st.notes[m])k.push(`note|${m}|${d}`);for(const t in ARR)for(const x of st[ARR[t]]||[])k.push(`${t}|${x.id}`);return k}
function stampAll(st,t){st.ts??={};for(const k of allKeys(st))if(!st.ts[k])st.ts[k]=t}
stampAll(S,1);
function kGet(st,k){const[t,a,b]=k.split('|');if(t==='log')return st.log?.[a]?.[b];if(t==='note')return st.notes?.[a]?.[b];if(t==='ch')return st.ch;return(st[ARR[t]]||[]).find(x=>x.id===a)}
function kPut(st,k,v){const[t,a,b]=k.split('|');if(v!==undefined)v=JSON.parse(JSON.stringify(v));
 if(t==='log'||t==='note'){const o=t==='log'?(st.log??={}):(st.notes??={});if(v===undefined){if(o[a])delete o[a][b]}else(o[a]??={})[b]=v;return}
 if(t==='ch'){if(v)st.ch=v;return}
 if(!ARR[t])return;
 const arr=st[ARR[t]]??=[],i=arr.findIndex(x=>x.id===a);if(v===undefined){if(i>=0)arr.splice(i,1)}else if(i>=0)arr[i]=v;else arr.push(v)}
function merge(L,R){const M=JSON.parse(JSON.stringify(L)),Rt=R.ts||{};M.ts??={};let inc=false,out=false;
 for(const k in Rt)if(Rt[k]>(M.ts[k]||0)){kPut(M,k,kGet(R,k));M.ts[k]=Rt[k];inc=true}
 for(const k in M.ts)if(M.ts[k]>(Rt[k]||0)){out=true;break}
 return{M,inc,out}}
const GH='https://api.github.com';
const ghH=()=>({Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json'});
const b64enc=str=>{const b=new TextEncoder().encode(str);let x='';for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(x)};
const b64dec=c=>new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\s/g,'')),ch=>ch.charCodeAt(0)));
const ghFetch=(path,opt={})=>fetch(`${GH}/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}${path}`,{cache:'no-store',...opt,headers:{...ghH(),...(opt.headers||{})}});
async function ghGet(){const r=await ghFetch('/contents/data.json');if(r.status===404)return null;if(!r.ok)throw new Error(r.status);const j=await r.json();let c=j.content;
 if(!c){const b=await fetch(j.git_url,{cache:'no-store',headers:ghH()});c=(await b.json()).content}
 return{sha:j.sha,data:JSON.parse(b64dec(c))}}
async function ghPut(path,content,sha,message){const r=await ghFetch('/contents/'+path,{method:'PUT',body:JSON.stringify({message,content,...(sha?{sha}:{})})});if(r.status===409||r.status===422)return false;if(!r.ok)throw new Error(r.status);return true}
let syncing=false,again=false,sT;
function schedSync(){if(!SY.joined)return;clearTimeout(sT);sT=setTimeout(syncNow,2000)}
const busy=()=>document.getElementById('sheet').classList.contains('open')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
function setSyn(t){const e=document.getElementById('syn');if(e)e.textContent=t}
async function syncNow(){if(!SY.joined||!SY.token)return;if(syncing){again=true;return}
 syncing=true;setSyn('☁️ синхронизация…');
 try{let inc=false,wait=false;
  for(let i=0;i<4;i++){const R=await ghGet();
   if(!R){if(await ghPut('data.json',b64enc(JSON.stringify(S)),null,'Семья: первая загрузка'))break;continue}
   if(busy()){wait=true;break}
   const x=merge(S,R.data);if(x.inc){S=fixS(x.M);saveLocal();inc=true}
   if(!x.out)break;
   if(await ghPut('data.json',b64enc(JSON.stringify(S)),R.sha,'Семья: обновление'))break}
  if(wait){clearTimeout(sT);sT=setTimeout(syncNow,4000);setSyn('')}
  else{await syncPhotos();SY.last=Date.now();saveSY();setSyn('☁️ синхронизировано в '+new Date(SY.last).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));if(inc&&!busy())render()}
 }catch(e){setSyn(e.message==='401'?'⚠️ облако: токен не подходит или истёк':'⚠️ нет связи с облаком — всё сохранено на телефоне')}
 finally{syncing=false}
 if(again){again=false;syncNow()}}
async function syncPhotos(){let ch=false;
 for(const p of S.plants){if(!p.hasPhoto)continue;let rec;try{rec=await dtx('readonly',s=>s.get(p.id),'photos')}catch(e){continue}
  if(!p.phv){if(!rec)continue;p.phv=Date.now();touch('plant|'+p.id);ch=true;rec={...rec,v:p.phv};await dtx('readwrite',s=>s.put(rec),'photos')}
  const path=`photos/${p.id}-${p.phv}.jpg`;
  if(rec&&rec.v===p.phv){if(SY.phUp[p.id]!==p.phv){await ghPut(path,(await b64(rec.blob)).split(',')[1],null,'Фото: '+p.name);SY.phUp[p.id]=p.phv;saveSY()}}
  else{const r=await ghFetch('/contents/'+path,{headers:{Accept:'application/vnd.github.raw'}});
   if(r.ok){const blob=await r.blob(),v=p.phv;await dtx('readwrite',s=>s.put({id:p.id,blob,v}),'photos');if(phURL[p.id]){URL.revokeObjectURL(phURL[p.id]);delete phURL[p.id]}SY.phUp[p.id]=v;saveSY();fillPhotos()}}}
 if(ch){saveLocal();schedSync()}}

 if(!o||!r||!t)return alert('Заполните все три поля');
 Object.assign(SY,{owner:o,repo:r,token:t});setSyn('☁️ подключение…');
 try{const rr=await ghFetch('');if(rr.status===401)throw new Error('Токен не подходит. Проверьте, что скопировали его целиком.');if(!rr.ok)throw new Error('Репозиторий не найден, или у токена нет к нему доступа.');
  const info=await rr.json();if(!info.private&&!confirm('Внимание: этот репозиторий ОТКРЫТЫЙ, данные семьи увидят все. Лучше сделать его закрытым (Private). Продолжить всё равно?')){setSyn('');return}
  const R=await ghGet();
  if(R&&confirm('В облаке уже есть данные семьи.\n\nОК — загрузить их на этот телефон (рекомендуется для второго телефона; данные этого телефона будут заменены).\nОтмена — объединить с данными этого телефона.')){const d=R.data,pins={};S.members.forEach(m=>{if(m.pinH)pins[m.id]=m.pinH});d.ts??={};(d.members||[]).forEach(m=>{if(!m.pinH&&pins[m.id]){m.pinH=pins[m.id];d.ts['member|'+m.id]=Date.now()}});S=fixS(d);saveLocal()}
  SY.joined=true;saveSY();curMid=(S.members.find(m=>m.id===ME)||S.members[0])?.id;render();await syncNow();render();
  alert('Подключено! Теперь данные семьи общие на всех телефонах.')}
 catch(e){SY.joined=false;saveSY();setSyn('');alert(e.message==='Failed to fetch'?'Нет интернета или GitHub недоступен.':e.message)}}

function pinHash(id,pin){let h=5381;const s='f40:'+id+':'+pin;for(let r=0;r<500;r++)for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return h.toString(36)}

 ${!sel?'':sel.pinH?`<label>ПИН-код<input id=lp class=pin type=password inputmode=numeric maxlength=8 autocomplete=off onkeydown="if(event.key==='Enter')doLogin()"></label><button class="btn pri wide" onclick="doLogin()">Войти</button><div class=mut style="margin-top:8px">Забыли ПИН? Супруг(а) может сбросить его у себя: «Настройки» → «Вход».</div>`

 <h3 style="margin-top:28px">Первый запуск?</h3><div class=mut>Сначала загрузите файл семьи <b>family40-semya.json</b> — в нём ФИО, даты рождения и направления челленджа. На втором телефоне вместо этого подключите облако после входа.</div>

function stats(mid){const hs=habitsOf(mid),n=Math.max(0,Math.min(S.ch.days,dayIdx(today())+1)),dd=dates().slice(0,n);let req=0,ach=0;
 for(const h of hs){if(h.type==='daily'){req+=h.slots.length*n;ach+=dd.reduce((a,d)=>a+done(mid,d,h.id),0)}
  else{req+=h.target*n/(h.type==='weekly'?7:30);const g={};dd.forEach((d,i)=>{const k=h.type==='weekly'?Math.floor(i/7):d.slice(0,7);g[k]=(g[k]||0)+(done(mid,d,h.id)?1:0)});for(const k in g)ach+=Math.min(g[k],h.target)}}
 return{n,pct:req?Math.min(100,Math.round(ach/req*100)):0}}
function dayPct(mid,d){const hs=habitsOf(mid).filter(h=>h.type==='daily');let r=0,a=0;hs.forEach(h=>{r+=h.slots.length;a+=done(mid,d,h.id)});const extra=habitsOf(mid).filter(h=>h.type!=='daily'&&done(mid,d,h.id)).length;return{p:r?a/r:0,extra}}

function rProg(){let h=goalsCard()+libCard();const t=today();
 for(const m of S.members){const hs=habitsOf(m.id);if(!hs.length)continue;const st=stats(m.id);
  let full=0,streak=0,run=0;const daily=hs.filter(x=>x.type==='daily');
  dates().slice(0,st.n).forEach(d=>{const ok=daily.length&&daily.every(x=>done(m.id,d,x.id)===x.slots.length);if(ok){full++;run++}else run=0});streak=run;

  dates().forEach((d,i)=>{const{p,extra}=dayPct(m.id,d),fut=d>t,hh=Math.max(2,p*90);const col=fut?'var(--line)':p>=1?'var(--ok)':p>=.6?'var(--warn)':'var(--bad)';

async function openDocs(mid){if(!guard(mid))return;const m=S.members.find(x=>x.id===mid);let list=[];try{list=(await allDocs()).filter(x=>x.mid===mid).sort((a,b)=>b.date.localeCompare(a.date))}catch(e){}
 const kb=n=>n>1048576?(n/1048576).toFixed(1)+' МБ':Math.ceil(n/1024)+' КБ';
 sheet('Документы · '+esc(shortName(m)),`<div class=note>Документы хранятся только на этом телефоне, в памяти браузера. В интернет и на GitHub они не отправляются. Делайте резервную копию в «Настройках».</div>
 <label class="btn pri wide" style="text-align:center;color:#fff">📎 Загрузить файлы<input type=file multiple style="display:none" onchange="upDocs('${mid}',this.files)"></label>
 <div class=card>${list.length?list.map(d=>`<div class=li><div class=f>📄 ${esc(d.name)}<div class=mut>${fmtS(d.date)} · ${kb(d.size)}</div></div><button class=btn onclick="getDoc('${d.id}')">⬇️</button><button class="btn red" onclick="delDoc('${d.id}','${mid}')">🗑</button></div>`).join(''):'<div class=mut>Документов пока нет.</div>'}</div>`)}
async function upDocs(mid,files){try{for(const f of files)await dtx('readwrite',s=>s.put({id:uid(),mid,name:f.name,type:f.type,size:f.size,date:today(),blob:f}))}catch(e){alert('Не удалось сохранить файл: '+e)}refreshDocCount();openDocs(mid)}
async function getDoc(id){const d=await dtx('readonly',s=>s.get(id));if(d)dl(d.blob,d.name)}
async function delDoc(id,mid){if(!confirm('Удалить документ?'))return;await dtx('readwrite',s=>s.delete(id));refreshDocCount();openDocs(mid)}

/* ---------- Новый челлендж: итоги текущего уходят в архив, отметки сохраняются ---------- */
function chResult(){const end=add(S.ch.start,S.ch.days-1);
 return S.members.filter(m=>habitsOf(m.id).length).map(m=>{const st=stats(m.id),dd=dates().slice(0,st.n);let full=0;dd.forEach(d=>{if(fullDay(m.id,d))full++});return{n:shortName(m),pct:st.pct,full,best:maxStreak(m.id)}})}
function newCh(){const i=dayIdx(today()),fin=i>=S.ch.days,nx=fin?today():add(today(),1);
 sheet('🏁 Завершить и начать новый',`<div class=note>Итоги «${esc(S.ch.title)}» сохранятся в «Прогресс» → «Пройденные челленджи». Все отметки, записи, книги и цели остаются. Направления можно поменять потом в «Настройках».</div>${fin?'':`<div class=note style="background:#fdecc8;color:#7a4b00">Текущий челлендж ещё идёт: день ${Math.max(1,i+1)} из ${S.ch.days}. Завершить досрочно?</div>`}
 <label>Чем запомнился этот челлендж? (необязательно)<textarea name=note rows=2 placeholder="Главный вывод, чем гордимся…"></textarea></label>
 <h3>Следующий челлендж</h3><label>Название<input name=title value="" placeholder="Например: 40 дней — здоровье и спорт"></label>
 <div class=row><label>Старт<input type=date name=start value="${nx}"></label><label>Дней<input type=number name=days min=1 max=365 value="40"></label></div>`,
 el=>{const title=fv(el,'title');if(!title){alert('Укажите название нового челленджа');return false}
  const a={id:uid(),title:S.ch.title,start:S.ch.start,days:Math.min(S.ch.days,Math.max(1,i+1)),end:add(S.ch.start,Math.min(S.ch.days,Math.max(1,i+1))-1),res:chResult(),note:fv(el,'note')};
  S.arch.push(a);touch('arc|'+a.id);
  S.ch={title,start:fv(el,'start')||nx,days:Math.max(1,Math.min(365,+fv(el,'days')||40))};touch('ch');curD=today();
  setTimeout(()=>celebrate('«'+a.title+'» — в архиве. Бисмиллях, новый старт!'),80)})}

/* ---------- Настройки ---------- */
const typeName={daily:'каждый день',weekly:'раз в неделю',monthly:'раз в месяц'};
function rSet(){let h=`${accCard()}${syncCard()}<h3>Текущий челлендж</h3><div class=card><label>Название<input id=chT value="${esc(S.ch.title)}"></label><div class=row><label>Старт<input type=date id=chS value="${S.ch.start}"></label><label>Дней<input type=number id=chN min=1 max=365 value="${S.ch.days}"></label></div><button class="btn pri wide" onclick="saveCh()">Сохранить</button><button class="btn wide" onclick="newCh()">🏁 Завершить и начать новый</button><div class=mut style="margin-top:6px">Пройдено челленджей: ${S.arch.length}. Итоги каждого хранятся во вкладке «Прогресс».</div></div><h3>Направления</h3>`;
 for(const x of S.habits)h+=`<div class=card><div class=hrow><span class=ic>${x.icon}</span><b>${esc(x.name)}</b><button class=btn onclick="editHabit('${x.id}')">✏️</button></div><div class=mut>${x.type==='daily'?x.slots.length+' раз '+typeName.daily:x.target+' '+typeName[x.type]} · ${x.members.map(id=>esc(shortName(S.members.find(m=>m.id===id)||{}))).join(', ')||'никто'}</div></div>`;
 h+=`<button class="btn wide" onclick="editHabit()">+ Новое направление</button><h3>Резервная копия</h3><div class=card><div class=mut>Сохраняйте копию раз в неделю (в Telegram «Избранное» или на Google Диск). С её помощью данные переносятся на другой телефон.</div><div class=row><button class=btn onclick="backup(false)">💾 Только данные</button><button class=btn onclick="backup(true)">💾 С документами и фото</button></div><label class="btn wide" style="text-align:center">📥 Восстановить из копии<input type=file accept=".json,application/json" style="display:none" onchange="restore(this.files[0])"></label></div>
 <h3>Как установить на телефон</h3><div class=card><div class=mut>Откройте ссылку в Safari (iPhone) или Chrome (Android) → «Поделиться» / меню ⋮ → «На экран Домой». После первого открытия приложение работает и без интернета.</div></div>
 <button class="btn red wide" onclick="if(confirm('Стереть все отметки? Члены семьи, родственники, архив и документы останутся.')){resetLog()}">Сбросить отметки</button><div class=mut style="text-align:center;margin-top:14px">Семья · версия ${APPV}</div>`;
 return h}
function saveCh(){S.ch.title=document.getElementById('chT').value.trim()||'Челлендж';S.ch.start=document.getElementById('chS').value||S.ch.start;S.ch.days=Math.max(1,Math.min(365,+document.getElementById('chN').value||40));touch('ch');save();render();alert('Сохранено')}
function editHabit(id){const x=S.habits.find(h=>h.id===id)||{id:uid(),name:'',short:'',icon:'⭐',type:'weekly',target:1,slots:[],members:S.members.map(m=>m.id)},isNew=!id;
 sheet(isNew?'Новое направление':'Направление',`<label>Название<input name=name value="${esc(x.name)}"></label><div class=row><label>Коротко (для таблицы)<input name=short value="${esc(x.short||'')}"></label><label>Значок<input name=icon value="${esc(x.icon)}"></label></div>
 <label>Как часто<select name=type><option value=daily ${x.type==='daily'?'selected':''}>Каждый день (по пунктам)</option><option value=weekly ${x.type==='weekly'?'selected':''}>N раз в неделю</option><option value=monthly ${x.type==='monthly'?'selected':''}>N раз в месяц</option></select></label>
 <label>Сколько раз (для недели / месяца)<input type=number name=target min=1 value="${x.target||1}"></label>
 <label>Пункты на день, через запятую (для «каждый день»)<input name=slots value="${esc((x.slots||[]).join(', '))}" placeholder="Фаджр, Зухр, Аср, Магриб, Иша"></label>
 <label>Очередь родственников<select name=kind><option value="">Нет</option><option value=call ${x.kind==='call'?'selected':''}>Звонки</option><option value=visit ${x.kind==='visit'?'selected':''}>Визиты</option></select></label>
 <label>Кто участвует</label>${S.members.map(m=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type=checkbox style="width:auto;margin:0" data-m="${m.id}" ${x.members.includes(m.id)?'checked':''}>${esc(fullName(m))}</label>`).join('')}
 ${isNew?'':`<button class="btn red wide" onclick="delHabit('${x.id}')">Удалить направление</button>`}`,
 el=>{x.name=fv(el,'name');if(!x.name){alert('Укажите название');return false}x.short=fv(el,'short');x.icon=fv(el,'icon')||'⭐';x.type=fv(el,'type');x.target=Math.max(1,+fv(el,'target')||1);
  x.slots=fv(el,'slots').split(',').map(s=>s.trim()).filter(Boolean);if(x.type==='daily'&&!x.slots.length)x.slots=['Сделано'];x.kind=fv(el,'kind')||undefined;
  x.members=[...el.querySelectorAll('[data-m]')].filter(c=>c.checked).map(c=>c.dataset.m);if(isNew)S.habits.push(x);touch('habit|'+x.id)})}
function delHabit(id){if(!confirm('Удалить направление?'))return;S.habits=S.habits.filter(x=>x.id!==id);touch('habit|'+id);save();closeSheet();render()}
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
async function backup(withDocs){const out={app:'family40',ver:1,date:today(),state:S};
 if(withDocs){const a=await allDocs();out.docs=[];for(const d of a)out.docs.push({...d,blob:await b64(d.blob)});
  const ph=await dtx('readonly',s=>s.getAll(),'photos');out.photos=[];for(const p of ph)out.photos.push({id:p.id,v:p.v,blob:await b64(p.blob)})}
 dl(new Blob([JSON.stringify(out)],{type:'application/json'}),`semya-${today()}${withDocs?'-docs':''}.json`)}
async function restore(file){if(!file)return;try{const o=JSON.parse(await file.text());if(!o.state||!o.state.members)throw'формат';if(!confirm('Заменить текущие данные данными из файла?'))return;const old=Object.keys(S.ts||{}),pins={};S.members.forEach(m=>{if(m.pinH)pins[m.id]=m.pinH});S=fixS(o.state);S.members.forEach(m=>{if(!m.pinH&&pins[m.id])m.pinH=pins[m.id]});S.ts={};const now=Date.now();stampAll(S,now);old.forEach(k=>{if(!S.ts[k])S.ts[k]=now});save();
 if(o.docs)for(const d of o.docs){const blob=await (await fetch(d.blob)).blob();await dtx('readwrite',s=>s.put({...d,blob}))}
 if(o.photos)for(const p of o.photos){const blob=await (await fetch(p.blob)).blob();await dtx('readwrite',s=>s.put({id:p.id,v:p.v,blob}),'photos')}
 curMid=S.members[0]?.id;refreshDocCount();render();alert('Готово! Данные загружены.')}catch(e){alert('Не удалось прочитать файл')}}

/* ---------- Каркас ---------- */
function go(t){tab=t;render();scrollTo(0,0)}
function render(){if(needLogin()){showLogin();return}document.getElementById('login')?.remove();document.getElementById('ttl').textContent=S.ch.title;const i=dayIdx(today());
 document.getElementById('sub').textContent=i<0?'Старт '+fmtD(S.ch.start):i>=S.ch.days?'Челлендж завершён — так держать!':'День '+(i+1)+' из '+S.ch.days;
 document.getElementById('main').innerHTML={today:rToday,table:rTable,prog:rProg,plants:rPlants,fam:rFam,set:rSet}[tab]();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));fillPhotos()}
render();refreshDocCount();syncNow();
let lastDay=today();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(lastDay!==today()){if(curD===lastDay)curD=today();lastDay=today();if(!busy())render()}syncNow()}});setInterval(()=>{if(!document.hidden)syncNow()},120000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
